<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cat Selfie Generator</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
  {
    "imports": {
      // No external libs needed; using native modules.
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>Cat Selfie Generator</h1>
    </header>

    <main class="main">
      <section class="controls">
        <div class="row">
          <button id="genBtn" class="btn primary">Generate Cat Selfie</button>
          <button id="stopBtn" class="btn" aria-pressed="false">Pause Motion</button>
        </div>

        <div class="row sliders">
          <label class="slider">
            <span>Motion</span>
            <input id="intensity" type="range" min="0" max="1" step="0.01" value="0.6" />
          </label>
          <label class="slider">
            <span>Zoom</span>
            <input id="zoom" type="range" min="0.9" max="1.2" step="0.005" value="1.02" />
          </label>
        </div>

        <div class="row radios">
          <label class="radio">
            <input type="radio" name="aspect" value="9:16" checked />
            <span>Portrait</span>
          </label>
          <label class="radio">
            <input type="radio" name="aspect" value="1:1" />
            <span>Square</span>
          </label>
        </div>
      </section>

      <section class="stage">
        <canvas id="glcanvas" aria-label="Generated cat selfie with motion effect"></canvas>
        <div id="placeholder" class="placeholder">
          <p>Tap “Generate Cat Selfie”</p>
        </div>
        <div id="loading" class="loading" aria-live="polite" aria-busy="true" hidden>
          <div class="spinner" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
          <p>Creating your cat selfie…</p>
        </div>
        <img id="hiddenImg" alt="" style="display:none" crossorigin="anonymous" />
      </section>

      <footer class="tips">
        <p>Tip: Drag your finger to nudge the motion. Long‑press to pause/resume.</p>
      </footer>
    </main>
  </div>

  <script type="module" src="./main.js"></script>

</body>
</html>
